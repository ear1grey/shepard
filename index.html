<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shepard Tone Generator</title>
<link rel="stylesheet" href="style.css">
<script src="main.js" type="module"></script>

<main>
  <label for="rN">
    <output for="rN" id="dN">8</output>
    <input type="range" id="rN" min="2" max="16" step="1">
    <span>Copies</span>
  </label>

  <label for="rSpd">
    <output for="rSpd" id="dSpd">+4.0</output>
    <input type="range" id="rSpd" min="-4" max="4" step="0.1">
    <span>Speed</span>
  </label>

  <label for="rMinF">
    <output for="rMinF" id="dMinF">55</output>
    <input type="range" id="rMinF" min="20" max="500" step="5">
    <span>Min Hz</span>
  </label>

  <label for="rMaxF">
    <output for="rMaxF" id="dMaxF">7040</output>
    <input type="range" id="rMaxF" min="500" max="20000" step="100">
    <span>Max Hz</span>
  </label>

  <label for="rBell">
    <output for="rBell" id="dBell">1.5</output>
    <input type="range" id="rBell" min="0.3" max="4" step="0.1">
    <span>Bell</span>
  </label>

  <label for="rVol">
    <output for="rVol" id="dVol">0.45</output>
    <input type="range" id="rVol" min="0" max="1" step="0.02">
    <span>Volume</span>
  </label>

  <label for="rPhase">
    <output for="rPhase" id="dPhase">0.00</output>
    <input type="range" id="rPhase" min="0" max="1" step="0.01">
    <span>Phase</span>
  </label>

  <label for="rDrift">
    <output for="rDrift" id="dDrift">0.00</output>
    <input type="range" id="rDrift" min="0" max="2" step="0.01">
    <span>Drift</span>
  </label>

  <fieldset id="modeGroup">
    <legend>Chord</legend>
    <label><input type="radio" name="mode" value="oct" checked><span>Octave</span></label>
    <label><input type="radio" name="mode" value="5th"><span>5th</span></label>
    <label><input type="radio" name="mode" value="maj"><span>Major</span></label>
    <label><input type="radio" name="mode" value="min"><span>Minor</span></label>
    <label><input type="radio" name="mode" value="dom7"><span>Dom 7th</span></label>
    <label><input type="radio" name="mode" value="maj7"><span>Maj 7th</span></label>
    <label><input type="radio" name="mode" value="dim7"><span>Dim 7th</span></label>
  </fieldset>

  <button id="btn" type="button">START</button>
</main>

<div id="viz"></div>
